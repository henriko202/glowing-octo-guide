<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="/favicon.svg"
      rel="icon"
      type="image/svg+xml"
    />
    <link
      href="/favicon.ico"
      rel="icon"
      sizes="any"
    />
    <link
      href="/apple-icon.png"
      rel="apple-touch-icon"
    />
    <meta
      content="width=device-width, initial-scale=1.0"
      name="viewport"
    />
    <title>Link Into The SSI</title>
    <meta
      content="#f2eee6"
      name="theme-color"
    />
    <script>
      // OAuth return: move the single-use login code out of the URL before any bundle, Sentry replay, or
      // error handler can observe location.href, then scrub the fragment from history. The code alone is
      // inert — the SPA redeems it with the PKCE verifier this browser stored at /auth/start, so the
      // session token never travels in a URL.
      // Only the /auth/success route captures anything: a crafted #code= fragment on any other path must
      // be ignored. A tab that already holds a session captures the code too (a member who signed in again
      // from the landing): only the verifier this tab stored at /auth/start redeems it, so a handed-over
      // code stays inert and the tab keeps its own session.
      ;(function () {
        try {
          if (!window.location.pathname.endsWith('/auth/success')) return
          var hash = window.location.hash.replace(/^#/, '')
          if (!hash) return
          var p = new URLSearchParams(hash)
          var code = p.get('code')
          var plan = p.get('plan')
          var interval = p.get('interval')
          if (code) sessionStorage.setItem('oauthCode', code)
          if (plan) sessionStorage.setItem('chosenPlan', plan)
          if (interval) sessionStorage.setItem('chosenInterval', interval)
          if (code || plan || interval) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search)
          }
        } catch (e) {}
      })()
    </script>
    <script>
      // Pre-hydration theme guard: apply the stored/system theme before first paint so a
      // dark-preferring user never sees a flash of the light theme. Mirrors the logic in
      // src/lib/theme.ts (resolveTheme/applyTheme); kept inline because it must run pre-bundle.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#0e1320' : '#f2eee6')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="/src/main.tsx"
      type="module"
    ></script>
  </body>
</html>
